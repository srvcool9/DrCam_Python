<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mex Technologies - Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-white font-sans">

<!-- Synced Navigation Bar -->
<nav class="flex justify-between items-center px-6 py-4 bg-white shadow-md">
  <!-- Branding / Logo -->
  <div class="flex items-center space-x-3">
    <div class="bg-red-800 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl font-semibold">
      {{ agency_name[0] }}
    </div>
    <h1 class="text-2xl font-extrabold text-red-800 tracking-tight">
      {{ agency_name }}
    </h1>
  </div>

  <!-- Navigation Links -->
  <div class="flex space-x-6 text-gray-700 font-medium">
    <a href="/dashboard" class="hover:text-red-800 transition">Home</a>
    <a href="/camera" class="hover:text-red-800 transition">Camera</a>
    <a href="/patient_history" class="hover:text-red-800 transition">Patient History</a>
    <a href="/setting" class="hover:text-red-800 transition">Settings</a>
  </div>

  <!-- Logout Button -->
  <div>
    <button
      onclick="window.location.href = '/'"
      class="bg-red-800 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-lg shadow-sm transition duration-300">
      Logout
    </button>
  </div>
</nav>

<!-- Settings Form -->
<div class="p-8 max-w-5xl mx-auto">
  <form id="profile-form" class="space-y-10">
    <h1 class="text-3xl font-bold text-gray-800">Profile</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div>
        <label class="block font-bold text-red-800 mb-2">Agency Name</label>
        <input type="text" name="agency_name" value="{{ data[1] if data else '' }}" required class="w-full p-3 bg-gray-100 rounded-lg" />
      </div>
      <div>
        <label class="block font-bold text-red-800 mb-2">Contact Number</label>
        <input type="text" name="contact_number" value="{{ data[2] if data else '' }}" required class="w-full p-3 bg-gray-100 rounded-lg" />
      </div>
      <div>
        <label class="block font-bold text-red-800 mb-2">Email</label>
        <input type="email" name="email" value="{{ data[3] if data else '' }}" required class="w-full p-3 bg-gray-100 rounded-lg" />
      </div>
    </div>

    <div>
      <label class="block font-bold text-red-800 mb-2">Password</label>
      <div class="flex items-center gap-2">
        <input type="password" name="password" value="{{ data[4] if data else '' }}" required class="w-full p-3 bg-gray-100 rounded-lg" />
        <span class="cursor-pointer">👁️</span>
      </div>
    </div>

    <h2 class="text-2xl font-semibold text-gray-700 mt-10">Mex Technologies</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block font-bold text-red-800 mb-2">Email</label>
        <input type="email" name="mex_email" value="{{ data[5] if data else '' }}" readonly class="w-full p-3 bg-gray-200 text-gray-600 rounded-lg" />
      </div>
      <div>
        <label class="block font-bold text-red-800 mb-2">Contact Number</label>
        <input type="text" name="mex_contact" value="{{ data[6] if data else '' }}" readonly class="w-full p-3 bg-gray-200 text-gray-600 rounded-lg" />
      </div>
    </div>

    <div class="text-right">
      <button type="submit" class="bg-red-800 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-lg">
        Save
      </button>
    </div>
  </form>
</div>

<script>
document.getElementById("profile-form").addEventListener("submit", async function(e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  try {
    const response = await fetch("/save_information", {
      method: "POST",
      body: formData
    });

    const result = await response.json();

    if (result.status === "saved" || result.status === "updated") {
      console.log("✅ Profile " + result.status + " successfully!");
    } else {
      console.log("❌ Something went wrong!");
    }
  } catch (err) {
    console.error("Error submitting form:", err);
  }
});
</script>

</body>
</html>
