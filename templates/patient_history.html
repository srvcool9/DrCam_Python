<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient History</title>

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- ✅ AG Grid offline -->
  <link rel="stylesheet" href="{{ url_for('static', filename='ag-grid/ag-grid.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ag-grid/ag-theme-alpine.css') }}">
  <script src="{{ url_for('static', filename='ag-grid/ag-grid-community.min.noStyle.js') }}"></script>
  <style>

  #myGrid .ag-header-cell-label {
    justify-content: center !important;
    font-weight: bold;
    color: white !important;
  }

    #myGrid .ag-header {
    background-color: #991B1B!important;
    color: white !important;
  }
  .ag-theme-alpine .ag-icon-filter::before {
    color: white !important;
}


.ag-theme-alpine .ag-header-cell:hover .ag-icon-filter::before {
    color: white !important;
}
</style>
</head>

<body class="bg-white font-sans">

  <!-- Navigation Bar -->
  <nav class="flex justify-between items-center px-6 py-4 bg-white shadow-md">
    <div class="flex items-center space-x-3">
      <div class="bg-red-800 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl font-semibold">
        {{ agency_name[0] }}
      </div>
      <h1 class="text-2xl font-extrabold text-red-800 tracking-tight">
        {{ agency_name }}
      </h1>
    </div>

    <div class="flex space-x-6 text-gray-700 font-medium">
      <a href="/dashboard" class="hover:text-red-800 transition">Home</a>
      <a href="/patient_registration" class="hover:text-red-800 transition">Patient Registration</a>
      <a href="/patient_history" class="hover:text-red-800 transition">Patient History</a>
      <a href="/setting" class="hover:text-red-800 transition">Settings</a>
    </div>

    <div>
      <button
        onclick="window.location.href = '/'"
        class="bg-red-800 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-lg shadow-sm transition duration-300">
        Logout
      </button>
    </div>
  </nav>

  <!-- Patient History Grid -->
  <div class="p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Patient History</h1>

    <!-- AG Grid container -->
    <div id="myGrid" class="ag-theme-alpine border border-red-800 rounded-lg shadow-sm" style="height: calc(100vh - 100px); width: 100%;"></div>
  </div>

  <!-- Modal for Visit History -->
  <script>
    function openHistoryModal(dates, patient_id) {
      let modal = document.getElementById("historyModal");

      if (!modal) {
        modal = document.createElement("div");
        modal.id = "historyModal";
        modal.style.position = "fixed";
        modal.style.top = "50%";
        modal.style.left = "50%";
        modal.style.transform = "translate(-50%, -50%)";
        modal.style.backgroundColor = "#fff";
        modal.style.border = "1px solid #ccc";
        modal.style.padding = "20px";
        modal.style.zIndex = "1000";
        modal.style.maxHeight = "300px";
        modal.style.overflowY = "auto";
        modal.style.boxShadow = "0 0 10px rgba(0, 0, 0, 0.2)";
        modal.style.width = "300px";
        modal.style.borderRadius = "8px";

        modal.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;color: #b91c1c;">Visit History</h3>
            <span onclick="document.getElementById('historyModal').remove()"
                  style="cursor: pointer; font-size: 20px; font-weight: bold;">&times;</span>
          </div>
          <hr style="margin-top: 6px; margin-bottom: 6px;">
          <ul id="historyDatesList" style="margin-top: 10px; padding-left: 10px;"></ul>
        `;

        document.body.appendChild(modal);
      }

      const list = modal.querySelector("#historyDatesList");
      list.innerHTML = "";

      if (Array.isArray(dates) && dates.length) {
        dates.forEach(date => {
          const li = document.createElement("li");

          const link = document.createElement("a");
          link.onclick = () => {
            window.location.href = `/camera?patient_id=${encodeURIComponent(patient_id)}&appointment_date=${encodeURIComponent(date)}`;
          };

          link.textContent = date;
          link.style.color = "#0077a3";
          link.style.textDecoration = "underline";
          link.style.cursor = "pointer";

          li.appendChild(link);
          list.appendChild(li);
        });
      } else {
        list.innerHTML = "<li>No visit history found.</li>";
      }
    }
  </script>

  <!-- ✅ AG Grid Initialization for v29+ -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const columnDefs = [
        {
          headerName: 'Patient ID',
          field: 'appointment_id',
          cellClass: "text-center",

          cellRenderer: params =>
            `<a href="/camera?patient_id=${params.data.patient_id}" class="text-blue-700 underline">${params.data.appointment_id}</a>`
        },
        { headerName: 'Patient Name', field: 'patient_name' ,flex:1,    cellClass: "text-center"},
        { headerName: 'Last Visited', field: 'last_visited', flex:2,    cellClass: "text-center" },
        {
          headerName: 'Visit History',
          field: 'visit_dates',
          flex:1,
          cellClass: "text-center",
          cellRenderer: params =>
            `<span class="cursor-pointer" onclick='openHistoryModal(${JSON.stringify(params.value)}, ${params.data.patient_id})'>👁️</span>`
        },
        {
          headerName: 'Generate PDF',
          field: 'pdf',
          cellClass: "text-center",
          flex:1,
          cellRenderer: params =>
            `<span class="cursor-pointer" onclick="location.href='/pdf_gen/${params.data.patient_id}/${encodeURIComponent(params.data.patient_name)}'">📄</span>`
        }
      ];

      const rowData = {{ dto_list | tojson | safe }};
      console.log(rowData);

      const gridOptions = {
        theme: 'legacy',
        columnDefs,
        rowData,
        pagination: true,
        paginationPageSize: 10,
        defaultColDef: {
          sortable: true,
          filter: true,
          resizable: true,
        },
      };

      const gridDiv = document.querySelector('#myGrid');
      agGrid.createGrid(gridDiv, gridOptions);
    });
  </script>

</body>
</html>
