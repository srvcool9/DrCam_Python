<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mex Technologies - Patient Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.7.4/lottie.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-white font-sans">

<!-- Navigation Bar -->
<nav class="flex justify-between items-center px-6 py-4 bg-white shadow-md">
  <div class="flex items-center space-x-3">
    <div class="bg-red-800 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl font-semibold">
      {{ agency_name[0] }}
    </div>
    <h1 class="text-2xl font-extrabold text-red-800 tracking-tight">
      {{ agency_name }}
    </h1>
  </div>
  <div class="flex space-x-6 text-gray-700 font-medium">
    <a href="/dashboard" class="hover:text-red-800 transition">Home</a>
    <a href="/patient_registration" class="hover:text-red-800 transition">Patient Registration</a>
    <a href="/patient_history" class="hover:text-red-800 transition">Patient History</a>
    <a href="/setting" class="hover:text-red-800 transition">Settings</a>
  </div>
  <div>
    <button
      onclick="window.location.href = '/'"
      class="bg-red-800 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-lg shadow-sm transition duration-300">
      Logout
    </button>
  </div>
</nav>

<!-- Registration Section -->
<section class="max-w-6xl mx-auto mt-10 bg-gray-50 p-8 rounded-xl shadow-md">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">

    <!-- Lottie Animation -->
    <div class="flex justify-center">
      <div id="lottie-container" style="width: 100%; max-width: 400px; height: 300px;"></div>
    </div>

    <!-- Form -->
    <div>
  <h2 class="text-2xl font-bold text-red-800 mb-6">Patient Registration</h2>
  <form id="patientForm" class="grid grid-cols-1 gap-4">

    <!-- Patient ID with search icon -->
    <!-- Patient ID input with right-aligned clickable search icon -->
<div class="relative">
  <input type="text" name="id" id="patient_id" placeholder="Search or enter Patient ID"
         class="pr-10 p-3 rounded-md bg-white border border-gray-300 w-full" />

  <button type="button"  onclick="loadPatients()"  class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-red-800">
    <!-- Search Icon (Heroicon style) -->
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
         viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
    </svg>
  </button>
</div>

    <input type="text" name="patient_name" id="patient_name" placeholder="Patient Name"
           class="p-3 rounded-md bg-white border border-gray-300">

    <select name="gender" id="gender" class="p-3 rounded-md bg-white border border-gray-300">
      <option value="">Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Transgender">Transgender</option>
    </select>

    <input type="date" id="dob" name="dob" placeholder="Date of Birth"
           class="p-3 rounded-md bg-white border border-gray-300">

    <input type="text"  id="phone"  name="phone" placeholder="Phone No."
           class="p-3 rounded-md bg-white border border-gray-300">

    <input type="text"  id="address"  name="address" placeholder="Address"
           class="p-3 rounded-md bg-white border border-gray-300">

    <div class="flex gap-6">
      <button type="submit"
              class="bg-red-800 hover:bg-red-800 text-white font-semibold px-6 py-3 rounded-lg w-full">
        Save
      </button>
      <button type="submit"
              class="bg-red-800 hover:bg-red-800 text-white font-semibold px-6 py-3 rounded-lg w-full">
        Skip
      </button>
    </div>

  </form>
</div>


  </div>
</section>

<!-- Submit Handler -->
<script>

document.getElementById("patientForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  try {
    const response = await fetch("/register_patient", {
      method: "POST",
      body: formData
    });

    const result = await response.json();
    if (result.status === "saved" || result.status === "updated") {
      alert("Profile " + result.status + " successfully!");
       window.location.href = "/camera?patient_id="+result.patient_id;
    } else {
      alert(" Something went wrong!");
    }
  } catch (err) {
    alert("Error submitting form:", err);
  }
});

async function loadPatients() {
  const patientId = document.getElementById("patient_id").value.trim();
  if (!patientId) {
    alert("Please enter a Patient ID to search.");
    return;
  }

  try {
    const res = await fetch(`/load_patient/${patientId}`);
    const data = await res.json();

    if (data.status === "success") {
      const p = data.patient;
      document.getElementById("patient_name").value = p.patient_name;
      document.getElementById("gender").value = p.gender;
      document.getElementById("dob").value = p.dob;
      document.getElementById("phone").value = p.phone;
      document.getElementById("address").value = p.address;
    } else {
      alert("Patient not found.");
    }
  } catch (error) {
    console.error("Error fetching patient:", error);
    alert("Failed to load patient data.");
  }
}
</script>

<!-- Lottie Load -->
<script>
lottie.loadAnimation({
  container: document.getElementById('lottie-container'),
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: '/static/Optometrists.json'  // Replace with your Lottie JSON file path
});
</script>

</body>
</html>
